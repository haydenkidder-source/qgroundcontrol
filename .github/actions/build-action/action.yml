name: Build action
description: Build action whose dist hasn't been updated from source
inputs:
  repo:
    description: Trusted target repo to build (must be validated by the caller)
    required: true
  ref:
    description: Trusted branch, tag or SHA to checkout (must be validated by the caller)
    required: false
    default: master
# npm executes code from repo/ref, including dependency lifecycle scripts.
# Callers must validate both inputs against trusted sources before invoking this action.
# Set permissions: { contents: read } on the calling job and expose no secrets to the build.
# Composite actions cannot restrict the calling job's GITHUB_TOKEN permissions.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.ref }}
        path: build-action
        persist-credentials: false

    - uses: actions/setup-node@v6
      with:
        node-version: 'lts/*'

    - name: Build ${{ inputs.repo }}
      run: |
        cd build-action
        npm ci || npm install
        npm run build
      shell: bash
