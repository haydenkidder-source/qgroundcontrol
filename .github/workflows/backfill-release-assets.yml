name: Backfill Release Assets

# One-off utility to attach installer assets to a GitHub Release that was
# published without going through release.yml's automated pipeline (e.g. a
# tag created directly, bypassing semantic-release). Reuses release.yml's
# own artifact-download step, pointed at an explicit tag and commit instead
# of a fresh semantic-release run. Delete this workflow once it's no longer
# needed.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach assets to (e.g. v1.5.2)'
        required: true
        type: string
      head_sha:
        description: 'Commit SHA the Linux/Windows builds were produced from'
        required: true
        type: string
      linux_run_id:
        description: 'Completed linux.yml run ID that built this commit'
        required: true
        type: string
      windows_run_id:
        description: 'Completed windows.yml run ID that built this commit'
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload-artifacts:
    name: Upload Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate source SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-source.spdx.json
          artifact-name: sbom-source-spdx

      - name: Generate source SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/sbom-source.cdx.json
          artifact-name: sbom-source-cyclonedx

      # --strict-runs requires a pre-built run snapshot (download_artifacts.py
      # refuses to search by SHA alone in strict mode). Build it the same way
      # release_builds.py does: the raw `gh api` run object for each explicit
      # run ID, so download_artifacts.py's identity checks (head_sha,
      # run_attempt, status) match exactly.
      - name: Build run snapshot
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          linux_run=$(gh api "repos/${GH_REPO}/actions/runs/${{ inputs.linux_run_id }}")
          windows_run=$(gh api "repos/${GH_REPO}/actions/runs/${{ inputs.windows_run_id }}")
          jq -n --argjson l "$linux_run" --argjson w "$windows_run" '[$l, $w]' > release-build-runs.json

      - name: Download artifacts
        uses: ./.github/actions/download-all-artifacts
        with:
          head-sha: ${{ inputs.head_sha }}
          workflows: Linux,Windows
          event: push
          strict-runs: 'true'
          runs-file: release-build-runs.json
          output-dir: artifacts
          artifact-prefixes: Custom-QGroundControl,sbom-

      # release_assets.py unconditionally requires an AppImage .zsync sidecar,
      # but that file is only produced by the tag-triggered official release
      # path (gated behind QGC_APPIMAGE_UPDATE_INFORMATION), which this
      # backfill deliberately isn't using - these are ordinary push builds.
      # Select the same asset set by hand instead, omitting the zsync files;
      # the installers themselves are unaffected, only AppImage in-app
      # auto-update metadata is absent for this specific release.
      - name: Select release assets
        run: |
          set -euo pipefail
          : > release-assets.txt
          for dir in Custom-QGroundControl-x86_64 Custom-QGroundControl-aarch64 \
                     Custom-QGroundControl-installer-AMD64 Custom-QGroundControl-installer-ARM64 \
                     Custom-QGroundControl-installer-AMD64-ARM64; do
            found=0
            for f in "artifacts/${dir}"/*; do
              [[ "$f" == *.zsync ]] && continue
              echo "$f" >> release-assets.txt
              found=1
            done
            if [[ "$found" -eq 0 ]]; then
              echo "::error::No files found for expected package ${dir}"
              exit 1
            fi
          done
          find artifacts -type f -name 'sbom-*' >> release-assets.txt
          echo "${RUNNER_TEMP}/sbom-source.spdx.json" >> release-assets.txt
          echo "${RUNNER_TEMP}/sbom-source.cdx.json" >> release-assets.txt
          echo "Selected assets:"
          cat release-assets.txt

      - name: Upload to Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mapfile -t release_assets < release-assets.txt
          gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber
