name: "QGroundControl CodeQL Config"
# workflows/codeql.yml analyzes Actions, Java/Kotlin, and Python.
# C++ is not analyzed by CodeQL; workflows/analysis.yml runs clang-tidy and clazy.

paths:
  - src
  - android/src
  - tools
  - deploy
  - test
  - .github

paths-ignore:
  - '**/moc_*'
  - '**/qrc_*'
  - '**/ui_*'
  - '**/*_autogen/**'
  - '**/libs/**'
  - '**/3rdparty/**'
  - '**/build/**'
  # CPM_SOURCE_CACHE (CMakeLists.txt) and the aqtinstall Qt SDK (tools/setup/install_qt.py)
  # both land inside the workspace and get compiled, so the C++ extractor picks them up
  # despite not being listed under `paths` above — vendored/SDK code, not ours to fix.
  - '**/.cache/**'
  - '**/.qt/**'
  # Vendored Android Java sources — upstream libsdl/freedesktop, not ours to fix.
  - 'android/src/org/libsdl/**'
  - 'android/src/org/freedesktop/**'

queries:
  - uses: security-extended

query-filters:
  - exclude:
      # Stable release tags are accepted by actions/README.md; zizmor enforces ref-pin.
      id: actions/unpinned-tag
